[package]
name = "repoatlas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Shared application core for RepoAtlas"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.9"
sysinfo = "0.39.6"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
infer = "0.22.0"
imagesize = "0.15.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
