[package]
name = "repoatlas"
version.workspace = true
description = "RepoAtlas desktop application"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
name = "repoatlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
repoatlas-core = { path = "../crates/repoatlas-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Releases use a raw NSIS .exe on Windows and .app.tar.gz on macOS. The
# optional ZIP extractor is unused and pulls in vulnerable zip 4.x releases.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2.4.1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# Plugin 2.4 requires the Tauri 2.12 runtime used by both lockfiles.
tauri-plugin-global-shortcut = "~2.4.1"

[dev-dependencies]
tempfile = "3"
